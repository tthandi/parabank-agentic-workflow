# Safety allowlist — enforced by both the discovery loop (agent/loop.py)
# and the replay executor (replay/executor.py) before any action.
# See safety/allowlist.py for the loader and safety/policy.py for how
# risky/irreversible action *types* are additionally handled per-step.

target_app: parabank

# An entry may be a bare host (permits any port) or "host:port" (pins it).
# The local entries are pinned deliberately: a bare "localhost" permits
# every service on the machine, which is the wrong granularity for an
# allowlist whose job is to say which app instance the agent may drive.
# If you run ParaBank on another port, change it here as well as in
# PARABANK_BASE_URL — the allowlist is meant to be the thing you have to
# edit on purpose.
allowed_domains:
  - parabank.parasoft.com   # keep: the public instance stays a valid target (https/443)
  - localhost:8080
  - 127.0.0.1:8080

# Prefix match against the URL path. "*" suffix is stripped before matching.
allowed_routes:
  - /parabank/*

allowed_actions:
  - navigate
  - click
  - fill
  - select
  - wait_for
  - extract
  - assert

# TODO: as capabilities are recorded, note here which ones touch actions
# classified risky/irreversible (schema.RiskLevel) so a reviewer can see
# the full risk surface in one place, not just per-artifact.
