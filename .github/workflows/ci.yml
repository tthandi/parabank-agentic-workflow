name: CI

# The tests were written to run without a browser or an API key — that is a
# deliberate property of the suite (README: "running without live services"),
# and it is what makes CI possible at all here. Nothing in this workflow
# touches ParaBank or Anthropic.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Committed artifacts still validate
        # A schema change that silently invalidates a saved capability is
        # the failure mode most likely to slip past review, because the
        # artifacts are data rather than code.
        run: |
          python - <<'PY'
          from pathlib import Path
          from cua.artifact.store import ArtifactStore
          root = Path("capabilities")
          store = ArtifactStore(root)
          for cap_dir in sorted(p for p in root.iterdir() if p.is_dir()):
              for artifact in sorted(cap_dir.glob("*.json")):
                  store.load(cap_dir.name, artifact.stem)
                  print("ok", cap_dir.name, artifact.stem)
          PY
